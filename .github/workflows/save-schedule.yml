name: Save anime schedule

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours so no day is missed
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch schedule and merge into public/history.json
        run: node scripts/save-schedule.mjs
        env:
          # Optional: add a repo secret named UPSTREAM_API to use your own API base URL
          UPSTREAM_API: ${{ secrets.UPSTREAM_API }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/history.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: save anime schedule history"
            git push
          fi
